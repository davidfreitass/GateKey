<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>GateKey - Cadastro de Funcionário</title>
    <link rel="stylesheet" href="pg.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <a class="logo">GateKey</a>
    </div>
</nav>

<main class="container mt-4">

    <div class="card p-4 mx-auto" style="max-width: 480px;">
        <h4 class="text-center">Cadastrar Funcionário</h4>

        <form id="formFuncionario">
            
            <div class="mb-3">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" id="nome" class="form-control" placeholder="Digite o nome" required>
            </div>

            <div class="mb-3">
                <label for="cpf" class="form-label">CPF</label>
                <input type="text" id="cpf" class="form-control" placeholder="Digite o CPF" required>
            </div>

            <div class="mb-3">
                <label for="telefone" class="form-label">Telefone</label>
                <input type="text" id="telefone" class="form-control" placeholder="Digite o telefone">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-control" placeholder="Digite o email">
            </div>

            <div class="mb-3">
                <label for="status" class="form-label">Status</label>
                <select id="status" class="form-select">
                    <option value="ATIVO">ATIVO</option>
                    <option value="INATIVO">INATIVO</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-2">
                Cadastrar
            </button>

        </form>

    </div>

</main>

<script src="cadastroFuncionario.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
