<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>GateKey | Lista de Usuários</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3">
<span class="navbar-brand">GateKey</span>
</nav>


<div class="container mt-4">
<h3>Moradores</h3>
<table class="table table-bordered" id="tabelaMoradores"></table>


<h3 class="mt-5">Funcionários</h3>
<table class="table table-bordered" id="tabelaFuncionarios"></table>
</div>


<script>
async function carregarDados() {
const moradores = await fetch('http://localhost:8080/moradores').then(r => r.json());
const funcionarios = await fetch('http://localhost:8080/funcionarios').then(r => r.json());


document.getElementById('tabelaMoradores').innerHTML = moradores.map(m => `
<tr><td>${m.id}</td><td>${m.nome}</td><td><a href="selecionar.html?tipo=morador&id=${m.id}" class="btn btn-sm btn-primary">Cadastrar Digital</a></td></tr>
`).join('');


document.getElementById('tabelaFuncionarios').innerHTML = funcionarios.map(f => `
<tr><td>${f.id}</td><td>${f.nome}</td><td><a href="selecionar.html?tipo=funcionario&id=${f.id}" class="btn btn-sm btn-primary">Cadastrar Digital</a></td></tr>
`).join('');
}
carregarDados();
</script>
</body>
</html>
