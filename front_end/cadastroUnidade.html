<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>GateKey - Cadastro de Unidade</title>
    <link rel="stylesheet" href="pg.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <a class="logo">GateKey</a>
    </div>
</nav>

<main class="container mt-4">

    <div class="card p-4 mx-auto" style="max-width: 480px;">
        <h4 class="text-center">Cadastro de Unidade</h4>

        <form id="formUnidade">

            <div class="mb-3">
                <label for="numero" class="form-label">Número</label>
                <input type="text" id="numero" class="form-control" placeholder="Digite o número" required>
            </div>

            <div class="mb-3">
                <label for="bloco" class="form-label">Bloco</label>
                <input type="text" id="bloco" class="form-control" placeholder="Digite o bloco" required>
            </div>

            <div class="mb-3">
                <label for="tipo" class="form-label">Tipo</label>
                <select id="tipo" class="form-select" required>
                    <option value="" selected disabled>Selecione o tipo</option>
                    <option value="APTO">Apartamento</option>
                    <option value="CASA">Casa</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-2">
                Cadastrar
            </button>

        </form>

    </div>

</main>

<script src="cadastroUnidade.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
