<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GateKey - Cadastro de Biometria</title>

  <link rel="stylesheet" href="cadastroDigital.css" />
  <link rel="stylesheet" href="pg.css" />

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>

<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="logo">GateKey</a>

    <div class="collapse navbar-collapse show">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
            ➕ Cadastrar
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="cadastroMorador.html">Morador</a></li>
            <li><a class="dropdown-item" href="cadastroFuncionario.html">Funcionário</a></li>
            <li><a class="dropdown-item" href="cadastroUnidade.html">Unidade</a></li>
            <li><a class="dropdown-item" href="logs.html">Logs</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="cadastroBiometria.html">Biometria</a></li>
          </ul>
        </li>
      </ul>

      <button class="btn btn-danger ms-3" onclick="logout()">Sair</button>
    </div>
  </div>
</nav>

<main class="container mt-4">

  <div class="card p-4 mb-4">
    <h4>Confirmar usuário</h4>

    <div class="mb-3">
      <label class="form-label">Tipo</label>
      <select id="tipoUsuario" class="form-select">
        <option value="">Selecione</option>
        <option value="morador">Morador</option>
        <option value="funcionario">Funcionário</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">ID do usuário</label>
      <input id="usuarioId" class="form-control" placeholder="Ex: 1">
    </div>

    <button id="confirmarUsuario" class="btn btn-primary">
      Confirmar usuário
    </button>
  </div>

  <div class="card p-4 d-none" id="biometria-box">
    <h4>Cadastro de Biometria</h4>

    <div class="mb-3">
      <button id="start-biometric" class="btn btn-success me-2">
        📲 Iniciar cadastro
      </button>

      <button id="delete-all" class="btn btn-danger">
        🗑️ Apagar digitais
      </button>
    </div>

    <div id="status-box" class="alert alert-secondary">
      Status: Aguardando...
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script type="module" src="cadastroDigital.js"></script>

</body>
</html>
